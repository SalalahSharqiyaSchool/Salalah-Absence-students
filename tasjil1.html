<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة مدرسة صلالة الشرقية | نظام رصد الغياب الذكي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0B1325;
            --bg-surface: #0F1A2F;
            --bg-card: #FFFFFF;
            --gold: #D4AF37;
            --gold-light: #F3D572;
            --gold-dim: rgba(212, 175, 55, 0.12);
            --gold-border: rgba(212, 175, 55, 0.35);
            --accent-blue: #1E4A76;
            --text-dark: #1E2A3A;
            --text-mid: #4A5B6E;
            --text-light: #A0B3C9;
            --success: #0F7B3A;
            --success-bg: #E2F3E8;
            --danger: #C7362E;
            --danger-bg: #FCECEA;
            --wa: #25D366;
            --border-card: rgba(212, 175, 55, 0.25);
            --shadow-card: 0 12px 28px -8px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(212, 175, 55, 0.1);
            --radius-md: 18px;
            --radius-sm: 14px;
            --transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: var(--bg-deep);
            color: #F0F4FA;
            min-height: 100vh;
            padding-bottom: 85px;
            position: relative;
        }

        /* خلفية عصرية */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(30, 74, 118, 0.35), transparent 70%),
                        repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.02) 0px, rgba(212, 175, 55, 0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* تذييل سفلي ذهبي */
        .gold-accent-line {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 1100;
        }

        /* رأس الصفحة */
        .app-header {
            background: rgba(15, 26, 47, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gold-border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: var(--gold-dim);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--gold-border);
            color: var(--gold-light);
            font-size: 1.3rem;
        }

        .school-name {
            font-weight: 900;
            font-size: 1.15rem;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .school-sub {
            font-size: 0.7rem;
            color: var(--gold-light);
            opacity: 0.9;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 60px;
            padding: 5px 12px 5px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-avatar {
            background: var(--gold-dim);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
        }

        .user-name {
            font-weight: 800;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .logout-btn {
            background: rgba(199, 54, 46, 0.2);
            border: 1px solid rgba(199, 54, 46, 0.4);
            border-radius: 40px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: #FF8A7A;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* حاوية */
        .container {
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 24px;
            position: relative;
            z-index: 2;
        }

        /* بطاقات أنيقة */
        .glass-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card);
            padding: 24px;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .card-header-style {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            border-right: 4px solid var(--gold);
            padding-right: 16px;
        }

        .card-icon-gold {
            background: var(--gold-dim);
            width: 48px;
            height: 48px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.3rem;
        }

        /* شريط التاريخ */
        .date-strip-modern {
            background: linear-gradient(145deg, #F8FAFF, #FFFFFF);
            border-radius: 22px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--gold-border);
        }

        /* اختيار الصف والشعبة بشكل احترافي */
        .dual-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 28px;
        }

        .selector-item {
            background: #F8FAFE;
            border-radius: 20px;
            padding: 8px 16px 12px;
            border: 1px solid #E9EDF4;
            transition: var(--transition);
        }

        .selector-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-mid);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            gap: 6px;
        }

        .modern-select {
            width: 100%;
            padding: 12px 14px;
            background: white;
            border: 1.5px solid #E2E8F2;
            border-radius: 16px;
            font-family: 'Cairo';
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .modern-select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-dim);
        }

        /* شريط إحصائيات وازرار */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stats-group {
            display: flex;
            gap: 12px;
        }

        .stat-chip {
            background: #F1F5F9;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--text-mid);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-chip.present { background: var(--success-bg); color: var(--success); }
        .stat-chip.absent { background: var(--danger-bg); color: var(--danger); }

        .action-btn {
            background: #F1F5F9;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 800;
            font-family: 'Cairo';
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn.danger-ghost {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* بحث */
        .search-field {
            margin-bottom: 18px;
            position: relative;
        }

        .search-field input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: #F8FAFE;
            border: 1.5px solid #E2E8F0;
            border-radius: 60px;
            font-family: 'Cairo';
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .search-field i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #A0B3C9;
        }

        /* قائمة الطلاب - بطاقات احترافية */
        .students-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 560px;
            overflow-y: auto;
            padding: 2px;
        }

        .student-tile {
            background: #FFFFFF;
            border-radius: 22px;
            padding: 12px 16px;
            border: 1.5px solid #EFF3F9;
            transition: all 0.2s;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 2;
            min-width: 150px;
        }

        .student-index {
            background: #EFF3F9;
            width: 32px;
            height: 32px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--text-mid);
        }

        .student-name {
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-dark);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 10px;
            background: #C0CFE0;
        }
        .status-dot.absent-dot { background: var(--danger); box-shadow: 0 0 0 2px rgba(199,54,46,0.2); }
        .status-dot.present-dot { background: var(--success); box-shadow: 0 0 0 2px rgba(15,123,58,0.2); }

        /* أزرار الحضور/الغياب */
        .btn-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-sm {
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.8rem;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-present {
            background: var(--success-bg);
            color: var(--success);
            border-color: rgba(15,123,58,0.2);
        }
        .btn-present.selected {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        .btn-absent {
            background: var(--danger-bg);
            color: var(--danger);
            border-color: rgba(199,54,46,0.2);
        }
        .btn-absent.selected {
            background: var(--danger);
            color: white;
        }

        .wa-icon-btn {
            background: rgba(37, 211, 102, 0.1);
            border-radius: 40px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--wa);
            cursor: pointer;
            transition: var(--transition);
        }

        /* حفظ */
        .save-global {
            background: linear-gradient(145deg, var(--success), #0A5C2E);
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-weight: 900;
            font-size: 1rem;
            color: white;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* التقرير والجداول */
        .table-responsive {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #EFF3F9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #F1F5F9;
            padding: 14px 12px;
            font-weight: 800;
            color: var(--text-dark);
            text-align: right;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ECF0F5;
        }

        /* ناف بار سفلي */
        .bottom-nav-premium {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 26, 47, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            gap: 8px;
            padding: 8px 24px;
            border-radius: 60px;
            border: 1px solid var(--gold-border);
            z-index: 1100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .nav-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.75rem;
            color: #9DACCA;
            transition: 0.2s;
        }
        .nav-icon i { font-size: 1.25rem; margin-bottom: 4px; }
        .nav-icon.active {
            background: var(--gold-dim);
            color: var(--gold-light);
        }

        /* مودال احترافية */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-card {
            background: white;
            border-radius: 32px;
            max-width: 480px;
            width: 100%;
            padding: 28px;
            border-top: 5px solid var(--gold);
        }

        /* إدارة الطلاب */
        .manager-row {
            display: flex;
            justify-content: space-between;
            background: #F9FBFE;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 10px;
            align-items: center;
        }

        @media (max-width: 640px) {
            .container { padding: 0 16px; }
            .dual-selector { grid-template-columns: 1fr; }
            .student-tile { flex-direction: column; align-items: stretch; gap: 12px; }
            .btn-group { justify-content: flex-start; }
        }

        /* print */
        @media print {
            .bottom-nav-premium, .app-header, .save-global, .action-btn, .search-field, .stats-bar, .no-print, .logout-btn, .btn-group { display: none; }
            .glass-card { box-shadow: none; border: 1px solid #ccc; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body>
<div class="gold-accent-line"></div>

<header class="app-header">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-landmark"></i></div>
        <div>
            <div class="school-name">مدرسة صلالة الشرقية</div>
            <div class="school-sub">نظام رصد الغياب الذكي | تعليم بلا حدود</div>
        </div>
    </div>
    <div class="user-area">
        <div class="user-card">
            <div class="user-avatar"><i class="fas fa-chalkboard-user"></i></div>
            <span class="user-name" id="teacherNameSpan">المعلم</span>
        </div>
        <div class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></div>
    </div>
</header>

<main class="container">
    <!-- تبويب رصد الغياب -->
    <div id="recordTab" class="tab-content">
        <div class="glass-card">
            <div class="date-strip-modern">
                <div style="display: flex; align-items: center; gap: 10px;"><i class="fas fa-calendar-alt" style="color: var(--gold);"></i> <span style="font-weight: 700;">تاريخ الغياب</span></div>
                <input type="date" id="absentDatePicker" style="border: 1.5px solid var(--gold-border); border-radius: 40px; padding: 8px 14px; font-family: Cairo; font-weight: bold;">
            </div>

            <div class="dual-selector">
                <div class="selector-item">
                    <div class="selector-label"><i class="fas fa-graduation-cap"></i> الصف الدراسي</div>
                    <select id="gradeSelect" class="modern-select" onchange="loadSectionsForRecord()">
                        <option value="">اختر الصف</option>
                    </select>
                </div>
                <div class="selector-item">
                    <div class="selector-label"><i class="fas fa-door-open"></i> الشعبة</div>
                    <select id="sectionSelect" class="modern-select" onchange="loadStudentsByClass()" disabled>
                        <option value="">اختر الشعبة</option>
                    </select>
                </div>
            </div>

            <div class="stats-bar">
                <div class="stats-group">
                    <div class="stat-chip"><i class="fas fa-users"></i> العدد: <span id="totalStudentsCount">0</span></div>
                    <div class="stat-chip present"><i class="fas fa-user-check"></i> حاضر: <span id="presentCount">0</span></div>
                    <div class="stat-chip absent"><i class="fas fa-user-slash"></i> غائب: <span id="absentCount">0</span></div>
                </div>
                <button class="action-btn danger-ghost" id="selectAllAbsentBtn" onclick="markAllAbsent()"><i class="fas fa-check-double"></i> تحديد الكل غائب</button>
            </div>

            <div class="search-field">
                <i class="fas fa-search"></i>
                <input type="text" id="searchStudent" placeholder="ابحث عن طالب بالاسم..." onkeyup="filterStudents()">
            </div>

            <div class="students-grid" id="studentsListContainer">
                <div style="text-align:center; padding:40px;">✨ اختار الصف والشعبة لظهور الطلاب</div>
            </div>

            <button class="save-global" id="saveAttendanceBtn" onclick="submitAttendance()"><i class="fas fa-cloud-upload-alt"></i> حفظ الغياب في السجل الذهبي</button>
        </div>
    </div>

    <!-- تبويب التقارير -->
    <div id="reportTab" class="tab-content" style="display: none;">
        <div class="glass-card">
            <div class="card-header-style"><div class="card-icon-gold"><i class="fas fa-chart-line"></i></div><div><h3 style="color:var(--text-dark);">تقارير متقدمة</h3></div></div>
            <div class="dual-selector" style="grid-template-columns: 1fr 1fr 1fr;">
                <div><label class="selector-label">من تاريخ</label><input type="date" id="reportFrom" class="modern-select"></div>
                <div><label class="selector-label">إلى تاريخ</label><input type="date" id="reportTo" class="modern-select"></div>
                <div><label class="selector-label">نوع التقرير</label><select id="reportType" class="modern-select"><option value="class">تقرير صف كامل</option><option value="student">تقرير طالب فردي</option></select></div>
            </div>
            <div class="dual-selector">
                <div><label class="selector-label">الصف</label><select id="reportGrade" class="modern-select" onchange="updateReportSections()"><option value="">اختر الصف</option></select></div>
                <div><label class="selector-label">الشعبة</label><select id="reportSection" class="modern-select" onchange="toggleReportStudentList()"><option value="">اختر الشعبة</option></select></div>
            </div>
            <div id="studentReportDiv" style="display:none; margin-top: 12px;"><label class="selector-label">اختر الطالب</label><select id="reportStudent" class="modern-select"></select></div>
            <button class="save-global" style="background: var(--gold); color: #1E2A3A; margin-top: 10px;" onclick="generateReport()"><i class="fas fa-eye"></i> عرض التقرير</button>
            <div id="reportResultArea" style="margin-top: 28px;"></div>
            <button id="printReportBtn" class="action-btn" style="margin-top:16px;display:none;" onclick="window.print()"><i class="fas fa-print"></i> طباعة التقرير</button>
        </div>
    </div>

    <!-- تبويب الإدارة -->
    <div id="manageTab" class="tab-content" style="display: none;">
        <div class="glass-card">
            <div class="card-header-style"><div class="card-icon-gold"><i class="fas fa-user-plus"></i></div><div><h3 style="color:var(--text-dark);">إضافة طالب جديد</h3></div></div>
            <div class="dual-selector">
                <input type="text" id="newName" class="modern-select" placeholder="الاسم الثلاثي">
                <input type="tel" id="newPhone" class="modern-select" placeholder="واتساب ولي الأمر">
            </div>
            <div class="dual-selector">
                <select id="newGrade" class="modern-select"><option value="">الصف</option><option>الخامس</option><option>السادس</option><option>السابع</option><option>الثامن</option><option>التاسع</option></select>
                <input type="number" id="newSectionNum" class="modern-select" placeholder="رقم الشعبة">
            </div>
            <button class="save-global" style="background: var(--accent-blue);" onclick="addStudent()"><i class="fas fa-save"></i> إضافة طالب</button>
        </div>
        <div class="glass-card">
            <div class="card-header-style"><div class="card-icon-gold"><i class="fas fa-edit"></i></div><div><h3 style="color:var(--text-dark);">تعديل / حذف الطلاب</h3></div></div>
            <div class="dual-selector"><select id="manageGrade" class="modern-select" onchange="loadManageSections()"><option value="">اختر الصف</option></select>
            <select id="manageSection" class="modern-select" onchange="loadManageStudents()"><option value="">الشعبة</option></select></div>
            <div id="manageStudentsList"></div>
        </div>
    </div>
</main>

<nav class="bottom-nav-premium">
    <div class="nav-icon active" data-tab="recordTab"><i class="fas fa-pen-alt"></i><span>رصد</span></div>
    <div class="nav-icon" data-tab="reportTab"><i class="fas fa-chart-simple"></i><span>تقارير</span></div>
    <div class="nav-icon" data-tab="manageTab"><i class="fas fa-database"></i><span>إدارة</span></div>
</nav>

<script>
    // ---------- مَحاكاة قاعدة البيانات localstorage مع api وهمي لكن متكامل ----------
    let studentsDB = JSON.parse(localStorage.getItem('school_students')) || [];
    let attendanceHistory = JSON.parse(localStorage.getItem('attendance_history')) || [];

    // حفظ البيانات الوهمية
    function persistStudents() { localStorage.setItem('school_students', JSON.stringify(studentsDB)); }
    function persistHistory() { localStorage.setItem('attendance_history', JSON.stringify(attendanceHistory)); }

    // بيانات تجريبية أولية
    if(studentsDB.length === 0) {
        studentsDB = [
            { name: "أحمد بن خالد المهري", phone: "96899887711", grade: "السابع", section: "1" },
            { name: "سالم بن راشد الكثيري", phone: "96899887722", grade: "السابع", section: "1" },
            { name: "مريم بنت علي الشحية", phone: "96899887733", grade: "السابع", section: "1" },
            { name: "عمر بن سعيد العلوي", phone: "96899887744", grade: "السابع", section: "2" },
        ];
        persistStudents();
    }

    let currentStudentsList = [];
    let currentAbsentBatch = [];  // قائمة بأسماء الطلاب الغائبين للحفظ المؤقت

    // متغيرات الواجهة
    function renderSelectGrades(selectId, selectedVal = "") {
        let grades = [...new Set(studentsDB.map(s => s.grade))];
        let select = document.getElementById(selectId);
        if(!select) return;
        select.innerHTML = '<option value="">اختر الصف</option>';
        grades.forEach(g => { select.innerHTML += `<option value="${g}" ${selectedVal===g ? 'selected':''}>${g}</option>`; });
    }

    function loadSectionsForRecord() {
        let grade = document.getElementById('gradeSelect').value;
        let secSelect = document.getElementById('sectionSelect');
        secSelect.innerHTML = '<option value="">اختر الشعبة</option>';
        if(!grade) { secSelect.disabled=true; return; }
        let sections = [...new Set(studentsDB.filter(s => s.grade === grade).map(s => s.section))];
        sections.sort().forEach(sec => { secSelect.innerHTML += `<option value="${sec}">شعبة ${sec}</option>`; });
        secSelect.disabled = false;
        currentStudentsList = [];
        renderStudentListUI();
    }

    function loadStudentsByClass() {
        let grade = document.getElementById('gradeSelect').value;
        let section = document.getElementById('sectionSelect').value;
        if(!grade || !section) { currentStudentsList = []; renderStudentListUI(); return; }
        currentStudentsList = studentsDB.filter(s => s.grade === grade && String(s.section) === String(section)).sort((a,b)=>a.name.localeCompare(b.name));
        // إعادة تعيين قائمة الغياب المؤقتة حسب الطلاب الحاليين
        currentAbsentBatch = [];
        renderStudentListUI();
    }

    function renderStudentListUI() {
        let container = document.getElementById('studentsListContainer');
        let searchVal = document.getElementById('searchStudent')?.value.toLowerCase() || "";
        let filtered = currentStudentsList.filter(s => s.name.toLowerCase().includes(searchVal));
        document.getElementById('totalStudentsCount').innerText = filtered.length;
        let present = filtered.length - currentAbsentBatch.filter(ab => filtered.some(f => f.name === ab)).length;
        let absentCount = currentAbsentBatch.filter(ab => filtered.some(f => f.name === ab)).length;
        document.getElementById('presentCount').innerText = present;
        document.getElementById('absentCount').innerText = absentCount;

        if(filtered.length === 0) { container.innerHTML = '<div style="text-align:center;padding:20px;">🚫 لا يوجد طلاب</div>'; return; }
        container.innerHTML = filtered.map((student, idx) => {
            let isAbsent = currentAbsentBatch.includes(student.name);
            return `<div class="student-tile" data-name="${student.name}">
                        <div class="student-info">
                            <div class="student-index">${idx+1}</div>
                            <div class="status-dot ${isAbsent ? 'absent-dot' : 'present-dot'}"></div>
                            <div class="student-name">${student.name}</div>
                        </div>
                        <div class="btn-group">
                            <button class="btn-sm btn-present ${!isAbsent ? 'selected' : ''}" onclick="setStudentAttendance('${student.name}', false)"><i class="fas fa-check"></i> حاضر</button>
                            <button class="btn-sm btn-absent ${isAbsent ? 'selected' : ''}" onclick="setStudentAttendance('${student.name}', true)"><i class="fas fa-times"></i> غائب</button>
                            ${isAbsent ? `<div class="wa-icon-btn" onclick="sendWhatsApp('${student.phone}','${student.name}')"><i class="fab fa-whatsapp"></i></div>` : ''}
                        </div>
                    </div>`;
        }).join('');
    }

    function setStudentAttendance(name, isAbsent) {
        if(isAbsent && !currentAbsentBatch.includes(name)) currentAbsentBatch.push(name);
        else if(!isAbsent && currentAbsentBatch.includes(name)) currentAbsentBatch = currentAbsentBatch.filter(n => n !== name);
        renderStudentListUI();
    }

    function markAllAbsent() {
        currentAbsentBatch = [...currentStudentsList.map(s => s.name)];
        renderStudentListUI();
    }

    function filterStudents() { renderStudentListUI(); }

    async function submitAttendance() {
        let date = document.getElementById('absentDatePicker').value;
        if(!date) { alert("يرجى تحديد تاريخ الغياب"); return; }
        if(currentAbsentBatch.length === 0) { alert("لم يتم اختيار أي طالب كغائب"); return; }
        let grade = document.getElementById('gradeSelect').value;
        let section = document.getElementById('sectionSelect').value;
        let newEntries = currentAbsentBatch.map(name => ({ name, date, class: `${grade}-${section}`, timestamp: new Date().toISOString() }));
        attendanceHistory.push(...newEntries);
        persistHistory();
        alert(`✅ تم تسجيل غياب ${newEntries.length} طالب/طلاب بنجاح`);
        currentAbsentBatch = [];
        renderStudentListUI();
    }

    // التقارير
    function updateReportSections() {
        let grade = document.getElementById('reportGrade').value;
        let secSelect = document.getElementById('reportSection');
        secSelect.innerHTML = '<option value="">اختر الشعبة</option>';
        if(!grade) return;
        let sections = [...new Set(studentsDB.filter(s=>s.grade===grade).map(s=>s.section))];
        sections.forEach(sec=> secSelect.innerHTML += `<option value="${sec}">شعبة ${sec}</option>`);
    }
    function toggleReportStudentList() {
        let grade = document.getElementById('reportGrade').value;
        let sec = document.getElementById('reportSection').value;
        let studentDiv = document.getElementById('studentReportDiv');
        let type = document.getElementById('reportType').value;
        if(type === 'student' && grade && sec) {
            let sts = studentsDB.filter(s=> s.grade === grade && String(s.section)===String(sec));
            let sel = document.getElementById('reportStudent');
            sel.innerHTML = '<option value="">اختر الطالب</option>';
            sts.forEach(s=> sel.innerHTML += `<option value="${s.name}">${s.name}</option>`);
            studentDiv.style.display = 'block';
        } else studentDiv.style.display = 'none';
    }
    function generateReport() {
        let type = document.getElementById('reportType').value;
        let from = document.getElementById('reportFrom').value;
        let to = document.getElementById('reportTo').value;
        let grade = document.getElementById('reportGrade').value;
        let section = document.getElementById('reportSection').value;
        if(!from || !to) { alert("يرجى تحديد الفترة"); return; }
        let filtered = attendanceHistory.filter(h => h.date >= from && h.date <= to);
        if(type === 'class') {
            if(!grade || !section) { alert("اختر الصف والشعبة"); return; }
            filtered = filtered.filter(h => h.class === `${grade}-${section}`);
            let studentsInClass = studentsDB.filter(s=> s.grade===grade && String(s.section)===String(section));
            let reportMap = new Map();
            studentsInClass.forEach(st => { reportMap.set(st.name, { name: st.name, days: [] }); });
            filtered.forEach(rec => { if(reportMap.has(rec.name)) reportMap.get(rec.name).days.push(rec.date); });
            let html = `<div class="table-responsive"><table><thead><tr><th>#</th><th>الطالب</th><th>أيام الغياب</th><th>عدد</th></tr></thead><tbody>`;
            let idx=1;
            for(let [_,val] of reportMap) {
                html += `<tr><td>${idx++}</td><td>${val.name}</td><td>${val.days.join(' - ')}</td><td style="color:var(--danger);font-weight:900;">${val.days.length}</td></tr>`;
            }
            html += `</tbody></table></div>`;
            document.getElementById('reportResultArea').innerHTML = html;
            document.getElementById('printReportBtn').style.display = 'flex';
        } else {
            let studentName = document.getElementById('reportStudent').value;
            if(!studentName) { alert("اختر الطالب"); return; }
            let studentRecord = filtered.filter(h => h.name === studentName);
            let studentInfo = studentsDB.find(s=> s.name === studentName);
            let html = `<div style="background:#F8FAFE; border-radius:24px; padding:20px;"><h4>${studentName}</h4><p>📞 ولي الأمر: ${studentInfo?.phone || 'غير مسجل'}</p><div class="table-responsive"><table><thead><tr><th>التاريخ</th><th>اليوم</th></tr></thead><tbody>`;
            studentRecord.forEach(rec => { html += `<tr><td>${rec.date}</td><td>${new Date(rec.date).toLocaleDateString('ar-EG', { weekday:'long' })}</td></tr>`; });
            html += `</tbody></table></div><div class="stat-chip absent" style="margin-top:12px;">إجمالي الغياب: ${studentRecord.length}</div></div>`;
            document.getElementById('reportResultArea').innerHTML = html;
            document.getElementById('printReportBtn').style.display = 'flex';
        }
    }

    // إدارة الطلاب
    function loadManageSections() {
        let grade = document.getElementById('manageGrade').value;
        let secSelect = document.getElementById('manageSection');
        secSelect.innerHTML = '<option value="">اختر الشعبة</option>';
        if(!grade) return;
        let sections = [...new Set(studentsDB.filter(s=> s.grade === grade).map(s=> s.section))];
        sections.forEach(sec=> secSelect.innerHTML += `<option value="${sec}">شعبة ${sec}</option>`);
    }
    function loadManageStudents() {
        let grade = document.getElementById('manageGrade').value;
        let section = document.getElementById('manageSection').value;
        let container = document.getElementById('manageStudentsList');
        if(!grade || !section) { container.innerHTML = ''; return; }
        let filtered = studentsDB.filter(s => s.grade === grade && String(s.section) === String(section));
        container.innerHTML = filtered.map(st => `
            <div class="manager-row">
                <div><strong>${st.name}</strong><br><span style="font-size:12px;">📞 ${st.phone}</span></div>
                <div><button class="action-btn" style="background:#EFF3F9;" onclick="editStudentPrompt('${st.name}')"><i class="fas fa-edit"></i></button>
                <button class="action-btn danger-ghost" onclick="deleteStudentConfirm('${st.name}')"><i class="fas fa-trash"></i></button></div>
            </div>
        `).join('');
    }
    function addStudent() {
        let name = document.getElementById('newName').value.trim();
        let phone = document.getElementById('newPhone').value.trim();
        let grade = document.getElementById('newGrade').value;
        let section = document.getElementById('newSectionNum').value.trim();
        if(!name || !phone || !grade || !section) { alert("املأ جميع الحقول"); return; }
        studentsDB.push({ name, phone, grade, section: String(section) });
        persistStudents();
        alert("تمت الإضافة");
        document.getElementById('newName').value = '';
        document.getElementById('newPhone').value = '';
        document.getElementById('newSectionNum').value = '';
        refreshAllSelects();
        loadManageStudents();
    }
    function editStudentPrompt(name) {
        let std = studentsDB.find(s=> s.name === name);
        let newName = prompt("الاسم الجديد:", std.name);
        let newPhone = prompt("رقم الهاتف الجديد:", std.phone);
        if(newName && newPhone) { std.name = newName; std.phone = newPhone; persistStudents(); refreshAllSelects(); loadManageStudents(); renderStudentListUI(); alert("تم التعديل"); }
    }
    function deleteStudentConfirm(name) {
        if(confirm(`حذف ${name} نهائياً؟ ستفقد سجلات الغياب.`)) {
            studentsDB = studentsDB.filter(s=> s.name !== name);
            attendanceHistory = attendanceHistory.filter(h=> h.name !== name);
            persistStudents(); persistHistory();
            refreshAllSelects(); loadManageStudents(); renderStudentListUI();
            alert("تم الحذف");
        }
    }
    function refreshAllSelects() {
        renderSelectGrades('gradeSelect'); renderSelectGrades('reportGrade'); renderSelectGrades('manageGrade');
        loadSectionsForRecord();
        loadManageSections();
    }

    function sendWhatsApp(phone, name) {
        let datePick = document.getElementById('absentDatePicker').value;
        let msg = `مركز مدرسة صلالة الشرقية: ولي أمر ${name} تم تسجيل غياب بتاريخ ${datePick || 'اليوم'}. الرجاء التواصل مع المدرسة.`;
        let url = `https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
        window.open(url);
    }

    // التنقل بين التبويبات
    document.querySelectorAll('.nav-icon').forEach(btn => {
        btn.addEventListener('click', () => {
            let tabId = btn.getAttribute('data-tab');
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
            document.querySelectorAll('.nav-icon').forEach(nav => nav.classList.remove('active'));
            btn.classList.add('active');
            if(tabId === 'manageTab') { renderSelectGrades('manageGrade'); loadManageSections(); }
            if(tabId === 'reportTab') { renderSelectGrades('reportGrade'); updateReportSections(); }
            if(tabId === 'recordTab') { renderSelectGrades('gradeSelect'); loadSectionsForRecord(); }
        });
    });

    function logout() { window.location.href = 'index.html'; }
    // عرض اسم المعلم وهمي
    document.getElementById('teacherNameSpan').innerText = sessionStorage.getItem('teacherName') || "أستاذ أحمد";
    document.getElementById('absentDatePicker').valueAsDate = new Date();
    renderSelectGrades('gradeSelect');
    renderSelectGrades('reportGrade');
    renderSelectGrades('manageGrade');
    loadSectionsForRecord();
    window.toggleReportStudentList = toggleReportStudentList;
    window.updateReportSections = updateReportSections;
    window.generateReport = generateReport;
    window.setStudentAttendance = setStudentAttendance;
    window.markAllAbsent = markAllAbsent;
    window.submitAttendance = submitAttendance;
    window.filterStudents = filterStudents;
    window.sendWhatsApp = sendWhatsApp;
    window.loadManageStudents = loadManageStudents;
    window.loadManageSections = loadManageSections;
    window.addStudent = addStudent;
    window.editStudentPrompt = editStudentPrompt;
    window.deleteStudentConfirm = deleteStudentConfirm;
    window.loadStudentsByClass = loadStudentsByClass;
    window.loadSectionsForRecord = loadSectionsForRecord;
</script>
</body>
</html>
