<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>منصة رصد الغياب - مدرسة صلالة الشرقية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --primary: #d4a017; /* ذهبي مستوحى من الشعار */
    --primary-light: #fef3c7;
    --primary-dark: #b45309;
    --secondary-green: #10b981; /* أخضر مستوحى من الكتاب */
    --secondary-red: #ef4444; /* أحمر مستوحى من الكتاب */
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 80px;
    -webkit-tap-highlight-color: transparent;
}

/* ===== HEADER ===== */
.header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary-light);
    padding: 2px;
    border: 1px solid var(--primary);
}

.brand-text h1 {
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.2;
}
.brand-text p {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 600;
}

.user-menu {
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
}
.btn-icon:hover { background: var(--surface-hover); color: var(--primary); }
.btn-icon.logout { color: var(--secondary-red); border-color: #fee2e2; }
.btn-icon.logout:hover { background: #fee2e2; }

/* ===== CONTAINER ===== */
.container {
    max-width: 600px;
    margin: 0 auto;
    padding: 16px;
}

/* ===== CARDS & SECTIONS ===== */
.card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
}

.section-title {
    font-family: 'Tajawal', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-main);
}
.section-title i { color: var(--primary); }

/* ===== DATE PICKER FIX ===== */
.date-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    background: var(--primary-light);
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--primary);
}

.date-display {
    flex: 1;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn-change-date {
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--primary);
    color: var(--primary-dark);
    border-radius: 8px;
    font-family: 'Cairo';
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
}
.btn-change-date:hover { background: var(--primary); color: white; }

/* Hidden input but accessible */
#dateInputHidden {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
}

/* ===== CHIPS (Grades/Sections) ===== */
.chips-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
    margin-bottom: 12px;
}
.chips-row::-webkit-scrollbar { display: none; }

.chip {
    padding: 8px 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
}
.chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    box-shadow: 0 4px 10px rgba(212, 160, 23, 0.3);
}

/* ===== STUDENT GRID ===== */
.controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.btn-toggle-all {
    padding: 8px 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Cairo';
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: var(--transition);
}
.btn-toggle-all:hover { border-color: var(--primary); color: var(--primary); }
.btn-toggle-all.is-deselecting {
    border-color: var(--secondary-red);
    color: var(--secondary-red);
    background: #fef2f2;
}

.counter {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
}
.counter span { color: var(--secondary-red); font-weight: 900; }

.students-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 4px;
}

.student-card {
    position: relative;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: var(--transition);
    text-align: center;
}

/* تمييز البطاقات بألوان خفيفة عند التحديد */
.student-card.selected {
    border-color: var(--secondary-red);
    background: #fef2f2;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
}

.avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    color: white;
    background: var(--border);
    transition: var(--transition);
}
.student-card.selected .avatar {
    background: var(--secondary-red);
    color: white;
}

.student-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.2;
}

.wa-btn {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 22px;
    height: 22px;
    background: #dcfce7;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--secondary-green);
    font-size: 11px;
    opacity: 0;
    transition: var(--transition);
}
.student-card.selected .wa-btn { opacity: 1; }
.wa-btn:active { transform: scale(0.9); }

.check-icon {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--secondary-red);
    color: white;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    border: 2px solid white;
    opacity: 0;
    transition: var(--transition);
}
.student-card.selected .check-icon { opacity: 1; bottom: -8px; }

/* ===== SEARCH ===== */
.search-box {
    position: relative;
    margin-bottom: 16px;
}
.search-box input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Cairo';
    font-size: 14px;
    background: var(--surface);
    transition: var(--transition);
}
.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.search-box i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
}

/* ===== SUMMARY & SAVE ===== */
.absent-summary {
    margin-top: 16px;
    padding: 12px;
    background: #fef2f2;
    border: 1px solid #fee2e2;
    border-radius: var(--radius-sm);
    display: none;
}
.absent-summary.active { display: block; }
.absent-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--secondary-red);
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
    background: white;
    border: 1px solid #fecaca;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    color: var(--secondary-red);
    display: flex;
    align-items: center;
    gap: 4px;
}
.tag i { cursor: pointer; font-size: 10px; }

.btn-save {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Cairo';
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(212, 160, 23, 0.3);
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.btn-save:active { transform: scale(0.98); }
.btn-save:disabled { background: var(--text-muted); box-shadow: none; opacity: 0.6; cursor: not-allowed; }

/* ===== MODAL ===== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-content {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 350px;
    text-align: center;
    transform: scale(0.9);
    transition: var(--transition);
}
.modal-overlay.open .modal-content { transform: scale(1); }

.modal-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
.modal-msg { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

.form-group { margin-bottom: 14px; text-align: right; }
.form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--text-muted); }
.form-group input, .form-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Cairo';
}

.btn-modal {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-family: 'Cairo';
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
}
.btn-primary { background: var(--primary); color: white; }
.btn-danger { background: var(--secondary-red); color: white; }
.btn-cancel { background: var(--surface-hover); color: var(--text-muted); }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    z-index: 40;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    transition: var(--transition);
    position: relative;
    padding: 4px 16px;
    cursor: pointer;
}
.nav-item i { font-size: 20px; transition: var(--transition); }
.nav-item.active { color: var(--primary); }
.nav-item.active i { transform: translateY(-2px); }
.nav-item.active::after {
    content: '';
    position: absolute;
    top: -10px;
    width: 30px;
    height: 3px;
    background: var(--primary);
    border-radius: 0 0 3px 3px;
}

/* Mobile Optimization */
@media (max-width: 480px) {
    .students-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .student-card { padding: 10px 6px; }
    .avatar { width: 38px; height: 38px; font-size: 14px; }
    .student-name { font-size: 12px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="brand">
        <img src="data/logo.jpeg" alt="Logo" class="logo-img">
        <div class="brand-text">
            <h1>مدرسة صلالة الشرقية</h1>
            <p>نظام رصد الغياب الذكي</p>
        </div>
    </div>
    <div class="user-menu">
        <button class="btn-icon" onclick="location.href='index.html'" title="خروج">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</header>

<div class="container">
    
    <!-- Date Selection (Fixed & Visible) -->
    <div class="card">
        <div class="section-title"><i class="far fa-calendar-alt"></i> تحديد التاريخ</div>
        <div class="date-row">
            <div class="date-display" id="dateDisplay">
                <i class="fas fa-calendar-day"></i> <span>اليوم، 1 يناير 2024</span>
            </div>
            <!-- زر واضح ومباشر لتغيير التاريخ -->
            <button class="btn-change-date" onclick="document.getElementById('dateInputHidden').showPicker()">
                <i class="fas fa-pen"></i> تعديل
            </button>
        </div>
        <!-- Hidden Input -->
        <input type="date" id="dateInputHidden" onchange="updateDateDisplay(this.value)">
        
        <!-- Grade Selection -->
        <div class="section-title" style="margin-top:16px;"><i class="fas fa-layer-group"></i> اختيار الصف</div>
        <div class="chips-row" id="gradesContainer">
            <!-- Generated by JS -->
        </div>

        <!-- Section Selection -->
        <div id="sectionsWrapper" style="display:none; margin-top:10px;">
            <div class="section-title"><i class="fas fa-users"></i> اختيار الشعبة</div>
            <div class="chips-row" id="sectionsContainer">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Students List -->
    <div class="card">
        <div class="section-title"><i class="fas fa-user-check"></i> قائمة الطلاب</div>
        
        <!-- Controls -->
        <div class="controls-bar">
            <button class="btn-toggle-all" id="btnToggleAll" onclick="toggleAllStudents()">
                <i class="fas fa-check-double"></i> <span>تحديد الكل</span>
            </button>
            <div class="counter">عدد الغائبين: <span id="absentCount">0</span></div>
        </div>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن طالب..." oninput="filterStudents()">
            <i class="fas fa-search"></i>
        </div>

        <!-- Grid -->
        <div class="students-grid" id="studentsGrid">
            <div style="grid-column: 1/-1; text-align:center; padding: 30px; color: var(--text-muted);">
                <i class="fas fa-mouse-pointer" style="font-size: 30px; margin-bottom: 10px; opacity: 0.3;"></i>
                <p>اختر الصف والشعبة لبدء الرصد</p>
            </div>
        </div>

        <!-- Summary -->
        <div class="absent-summary" id="absentSummary">
            <div class="absent-header">
                <span>قائمة الغائبين</span>
                <span style="cursor:pointer;" onclick="deselectAll()">إلغاء الكل</span>
            </div>
            <div class="tags" id="tagsContainer"></div>
        </div>

        <button class="btn-save" id="btnSave" onclick="saveAttendance()" disabled>
            <i class="fas fa-save"></i> حفظ البيانات
        </button>
    </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
    <div class="nav-item active">
        <i class="fas fa-clipboard-check"></i>
        <span>رصد الغياب</span>
    </div>
    <div class="nav-item" onclick="alert('قريباً: صفحة التقارير')">
        <i class="fas fa-chart-pie"></i>
        <span>التقارير</span>
    </div>
    <div class="nav-item" onclick="alert('قريباً: صفحة الإدارة')">
        <i class="fas fa-cogs"></i>
        <span>الإدارة</span>
    </div>
</nav>

<!-- Modal (Hidden by default) -->
<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <div class="modal-title" id="modalTitle">تمت العملية بنجاح</div>
        <div class="modal-msg" id="modalMsg">تم حفظ الغياب بنجاح.</div>
        <button class="btn-modal btn-primary" onclick="closeModal()">موافق</button>
    </div>
</div>

<script>
// بيانات تجريبية (يجب استبدالها بالبيانات الحقيقية من قاعدة البيانات)
const studentsData = [
    { id: 1, name: "أحمد محمد علي", grade: "الخامس", section: "أ", phone: "99999999", color: "#fca5a5" },
    { id: 2, name: "خالد سعيد الرشيدي", grade: "الخامس", section: "أ", phone: "99999998", color: "#86efac" },
    { id: 3, name: "فهد ناصر العمري", grade: "الخامس", section: "أ", phone: "99999997", color: "#93c5fd" },
    { id: 4, name: "سلطان حمد السليمي", grade: "الخامس", section: "أ", phone: "99999996", color: "#fdba74" },
    { id: 5, name: "يوسف إبراهيم البلوشي", grade: "الخامس", section: "ب", phone: "99999995", color: "#d8b4fe" },
    { id: 6, name: "عبدالله سالم الحوسني", grade: "السادس", section: "أ", phone: "99999994", color: "#fca5a5" },
];

let currentStudents = [];
let absentIds = new Set();

// تهيئة التاريخ عند التحميل
document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInputHidden').value = today;
    updateDateDisplay(today);
    renderGrades();
});

// تحديث عرض التاريخ
function updateDateDisplay(dateStr) {
    if(!dateStr) return;
    const date = new Date(dateStr);
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.querySelector('#dateDisplay span').textContent = date.toLocaleDateString('ar-OM', options);
}

// عرض الصفوف
function renderGrades() {
    const grades = [...new Set(studentsData.map(s => s.grade))];
    const container = document.getElementById('gradesContainer');
    container.innerHTML = '';
    grades.forEach(g => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = g;
        chip.onclick = () => selectGrade(g, chip);
        container.appendChild(chip);
    });
}

// اختيار الصف
function selectGrade(grade, element) {
    document.querySelectorAll('#gradesContainer .chip').forEach(c => c.classList.remove('active'));
    element.classList.add('active');
    
    const sections = [...new Set(studentsData.filter(s => s.grade === grade).map(s => s.section))];
    renderSections(sections);
}

// عرض الشعب
function renderSections(sections) {
    const wrapper = document.getElementById('sectionsWrapper');
    const container = document.getElementById('sectionsContainer');
    wrapper.style.display = 'block';
    container.innerHTML = '';
    
    sections.forEach(sec => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = `شعبة ${sec}`;
        chip.onclick = () => selectSection(sec, chip);
        container.appendChild(chip);
    });
}

// اختيار الشعبة وعرض الطلاب
function selectSection(section, element) {
    document.querySelectorAll('#sectionsContainer .chip').forEach(c => c.classList.remove('active'));
    element.classList.add('active');
    
    // فلترة الطلاب
    currentStudents = studentsData.filter(s => s.section === section); // تبسيط للعرض التجريبي
    renderStudents();
}

// عرض بطاقات الطلاب
function renderStudents(filterText = '') {
    const grid = document.getElementById('studentsGrid');
    grid.innerHTML = '';
    
    const filtered = currentStudents.filter(s => s.name.includes(filterText));
    
    if(filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px; color:var(--text-muted);">لا يوجد طلاب</div>';
        return;
    }

    filtered.forEach(s => {
        const card = document.createElement('div');
        card.className = `student-card ${absentIds.has(s.id) ? 'selected' : ''}`;
        card.onclick = (e) => {
            // منع التفعيل عند الضغط على زر الواتساب
            if(e.target.closest('.wa-btn')) return;
            toggleStudent(s.id);
        };

        // لون مميز للأفاتار
        const initial = s.name.charAt(0);
        
        card.innerHTML = `
            <div class="wa-btn" onclick="openWhatsApp('${s.phone}', '${s.name}')">
                <i class="fab fa-whatsapp"></i>
            </div>
            <div class="avatar" style="background:${s.color || '#cbd5e1'}; color:#334155;">${initial}</div>
            <div class="student-name">${s.name}</div>
            <div class="check-icon"><i class="fas fa-check"></i></div>
        `;
        grid.appendChild(card);
    });
}

// تبديل حالة طالب (غياب/حضور)
function toggleStudent(id) {
    if(absentIds.has(id)) {
        absentIds.delete(id);
    } else {
        absentIds.add(id);
    }
    updateUI();
}

// تحديد الكل / إلغاء الكل (زر واحد ذكي)
function toggleAllStudents() {
    const btn = document.getElementById('btnToggleAll');
    const isDeselecting = btn.classList.contains('is-deselecting');
    
    if(isDeselecting) {
        // إذا كان الوضع الحالي "إلغاء التحديد"، فنقوم بإلغاء تحديد الجميع
        deselectAll();
    } else {
        // إذا كان الوضع الحالي "تحديد الكل"، فنقوم بتحديد الجميع
        currentStudents.forEach(s => absentIds.add(s.id));
        updateUI();
    }
}

// دالة مساعدة لإلغاء الكل
function deselectAll() {
    absentIds.clear();
    updateUI();
}

// تحديث الواجهة (البطاقات، العداد، الأزرار)
function updateUI() {
    // تحديث البطاقات
    document.querySelectorAll('.student-card').forEach((card, index) => {
        // ملاحظة: في التطبيق الحقيقي يجب ربط index بـ ID أو إعادة رسم القائمة
        // هنا نفترض ترتيب المصفوفة ثابت
        const student = currentStudents[index];
        if(student && absentIds.has(student.id)) {
            card.classList.add('selected');
        } else {
            card.classList.remove('selected');
        }
    });

    // تحديث العداد
    document.getElementById('absentCount').textContent = absentIds.size;

    // تحديث زر تحديد الكل / إلغاء التحديد
    const btn = document.getElementById('btnToggleAll');
    const btnText = btn.querySelector('span');
    const btnIcon = btn.querySelector('i');
    
    if(absentIds.size === currentStudents.length && currentStudents.length > 0) {
        // الكل محدد -> عرض خيار إلغاء التحديد
        btn.classList.add('is-deselecting');
        btnText.textContent = 'إلغاء التحديد';
        btnIcon.className = 'fas fa-times';
    } else {
        // ليس الكل محدد -> عرض خيار تحديد الكل
        btn.classList.remove('is-deselecting');
        btnText.textContent = 'تحديد الكل';
        btnIcon.className = 'fas fa-check-double';
    }

    // تحديث قائمة الغائبين وحفظ
    updateAbsentSummary();
    document.getElementById('btnSave').disabled = absentIds.size === 0;
}

// عرض ملخص الغائبين
function updateAbsentSummary() {
    const summary = document.getElementById('absentSummary');
    const tags = document.getElementById('tagsContainer');
    tags.innerHTML = '';
    
    if(absentIds.size > 0) {
        summary.classList.add('active');
        const absentStudents = studentsData.filter(s => absentIds.has(s.id));
        absentStudents.forEach(s => {
            const tag = document.createElement('div');
            tag.className = 'tag';
            tag.innerHTML = `${s.name} <i class="fas fa-times" onclick="toggleStudent(${s.id})"></i>`;
            tags.appendChild(tag);
        });
    } else {
        summary.classList.remove('active');
    }
}

// فلترة البحث
function filterStudents() {
    const text = document.getElementById('searchInput').value;
    renderStudents(text);
}

// حفظ البيانات
function saveAttendance() {
    const btn = document.getElementById('btnSave');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
    
    // محاكاة طلب API
    setTimeout(() => {
        btn.innerHTML = '<i class="fas fa-save"></i> حفظ البيانات';
        btn.disabled = true;
        
        // إظهار مودال النجاح
        showModal('تم الحفظ بنجاح', `تم تسجيل غياب ${absentIds.size} طلاب.`);
        
        // إعادة تعيين
        absentIds.clear();
        updateUI();
    }, 1000);
}

// فتح واتساب
function openWhatsApp(phone, name) {
    const msg = `ولي أمر الطالب ${name}، نفيدكم بغياب الطالب اليوم عن المدرسة.`;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}

// مودال
function showModal(title, msg) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modal').classList.add('open');
}
function closeModal() {
    document.getElementById('modal').classList.remove('open');
}
</script>
